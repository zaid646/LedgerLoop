name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-service:
    name: Lint + tests (ai-service)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --dev
      - name: Ruff
        run: uv run ruff check .
      - name: Pytest
        run: uv run pytest -q
      - name: SFT data/format tests
        run: uv run python -m unittest discover -s ../sft/tests
      - name: Repo policy tests (Airflow DAG + CI configs)
        run: uv run pytest -q ../tests/test_airflow_dag.py ../tests/test_ci_configs.py

  backend:
    name: Typecheck + review logic (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  quality-gate:
    name: Confidence + drift quality gate
    runs-on: ubuntu-latest
    needs: python-service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - name: Sync env
        working-directory: ai-service
        run: uv sync --dev
      - name: Replay calibrated confidence and routing
        working-directory: ai-service
        run: uv run python ../evals/replay_confidence.py
      - name: Replay drift scenarios (hashing embedder for CI determinism)
        working-directory: ai-service
        run: uv run python ../evals/drift_sim.py --backend hashing --replicates 20 --null-windows 50 --out ../runs/drift-ci.json --no-plot
      - name: Gate on ECE, auto-approval accuracy, catch rate, drift detection
        working-directory: ai-service
        run: uv run python ../evals/quality_gate.py --confidence ../evals/results/confidence-replay.json --drift ../runs/drift-ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: quality-evidence
          path: |
            evals/results/confidence-replay.json
            evals/results/drift-sim.json
            evidence/png/confidence-reliability.png
            evidence/png/drift-detection.png
          if-no-files-found: warn

  benchmark-smoke:
    name: Ingestion benchmark smoke (serial + local Ray)
    runs-on: ubuntu-latest
    needs: python-service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - name: Sync env with benchmark extra
        working-directory: ai-service
        run: uv sync --dev --extra bench
      - name: Serial + local Ray, identical outputs
        working-directory: ai-service
        run: .venv/bin/python ../scripts/ingest_benchmark.py --docs 200 --chunk-size 50 --backends serial,ray --ray-local-mode --no-figure --out ../runs/ingest_smoke.json

  spark-benchmark:
    name: PySpark ingestion benchmark (local[*])
    runs-on: ubuntu-latest
    needs: python-service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - name: Install pyspark
        run: pip install pyspark==4.0.0 pydantic pydantic-settings
      - name: PySpark ingestion benchmark (8 000 docs, local[*])
        run: |
          python scripts/spark_ingest.py \
            --input evals/golden/v0.jsonl \
            --output /tmp/spark_output \
            --docs 8000 \
            --master local[*] \
            --out /tmp/spark_summary.json
      - name: Upload spark summary
        uses: actions/upload-artifact@v4
        with:
          name: spark-benchmark
          path: /tmp/spark_summary.json

  bert-training:
    name: BERT GL-coding fine-tune (CPU smoke)
    runs-on: ubuntu-latest
    needs: python-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install torch transformers scikit-learn sentencepiece
      - name: CPU smoke test (tiny BERT, 10 steps)
        run: |
          # prajjwal1/bert-tiny lacks tokenizer.json and fails on transformers>=5;
          # google/bert_uncased_L-2_H-128_A-2 is a genuine 2-layer BERT that works.
          python nlp/train_bert.py \
            --model google/bert_uncased_L-2_H-128_A-2 \
            --epochs 1 \
            --max-steps 10 \
            --batch-size 4 \
            --device cpu \
            --output-dir /tmp/bert_output \
            --results-dir /tmp/bert_results
      - name: Evaluate
        run: |
          python nlp/evaluate_bert.py \
            --model-dir /tmp/bert_output \
            --val-file sft/data/val.jsonl \
            --output /tmp/bert_results/eval_val.json \
            --device cpu
      - name: Upload BERT results
        uses: actions/upload-artifact@v4
        with:
          name: bert-results
          path: /tmp/bert_results/

  vit-training:
    name: ViT GL-classification (CPU smoke)
    runs-on: ubuntu-latest
    needs: python-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install torch torchvision transformers scikit-learn Pillow
      - name: CPU smoke test (ViT, 10 steps)
        run: |
          mkdir -p /tmp/vit_train/TRAVEL /tmp/vit_val/TRAVEL
          python - <<'PY'
          from PIL import Image
          import os
          for d in ['/tmp/vit_train/TRAVEL', '/tmp/vit_val/TRAVEL']:
              for i in range(4):
                  Image.new('RGB', (224, 224), color=(i*50, 100, 150)).save(os.path.join(d, f'img_{i}.jpg'))
          PY
          python cv/train_vit.py \
            --model google/vit-base-patch16-224 \
            --train-root /tmp/vit_train \
            --val-root /tmp/vit_val \
            --epochs 1 \
            --max-steps 10 \
            --batch-size 4 \
            --device cpu \
            --output-dir /tmp/vit_output \
            --results-dir /tmp/vit_results
      - name: Compare ViT vs YOLOv8n
        run: |
          python cv/compare_vit_yolo.py \
            --vit-results /tmp/vit_results/eval_val.json \
            --yolo-results cv/runs/receipt_fields_yolov8n/results.csv \
            --output /tmp/vit_results/comparison.json
      - name: Upload ViT results
        uses: actions/upload-artifact@v4
        with:
          name: vit-results
          path: /tmp/vit_results/

  eval-gate:
    name: Eval regression gate
    runs-on: ubuntu-latest
    needs: python-service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - name: Sync env
        working-directory: ai-service
        run: uv sync --dev
      - name: Run deterministic (heuristic) eval
        working-directory: ai-service
        run: uv run python ../evals/run_evals.py --engine heuristic --golden v0 --no-wandb --name ci-heuristic
      - name: Gate against baseline
        working-directory: ai-service
        run: uv run python ../evals/gate.py --results ../evals/results/ci-heuristic.json --baseline ../evals/baseline.json

  promptfoo:
    name: PromptFoo suite (if GPU endpoint configured)
    runs-on: ubuntu-latest
    needs: python-service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - name: Export prompt + tests from registry
        working-directory: ai-service
        run: uv sync --dev && uv run python ../evals/export_promptfoo.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run PromptFoo
        working-directory: evals
        env:
          VLLM_BASE_URL: ${{ secrets.VLLM_BASE_URL }}
          VLLM_API_KEY: ${{ secrets.VLLM_API_KEY }}
          VLLM_MODEL: ${{ secrets.VLLM_MODEL }}
        run: |
          if [ -z "$VLLM_BASE_URL" ]; then
            echo "VLLM_BASE_URL not configured — skipping PromptFoo (LLM suite runs once a GPU endpoint exists)."
            exit 0
          fi
          npx -y promptfoo@latest eval -c promptfoo/promptfooconfig.js --max-concurrency 4
