groups:
  - name: ledgerloop-confidence
    rules:
      - alert: DriftDetected
        expr: expenseiq_drift_fired == 1
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Receipt distribution drift detected"
          description: "A drift detector has fired for five minutes. Check /drift/status and the drift runbook before disabling auto-approval."
          runbook_url: "docs/runbooks/drift.md"
      - alert: AmountDriftScoreHigh
        expr: expenseiq_drift_score{detector="psi_amount"} > 1
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "Amount PSI above threshold"
          description: "PSI on log total_amount is above its calibrated threshold."
      - alert: ReviewQueueBacklog
        expr: expenseiq_review_queue_depth > 100
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "Human review backlog exceeds 100 documents"
          description: "Auto-approval may be too conservative or reviewers are unavailable."
      - alert: AutoApprovalRateLow
        expr: expenseiq_auto_approval_rate < 0.30
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "Auto-approval rate below 30%"
          description: "Check recent drift, model/provider changes and confidence calibration."
      - alert: ExtractionLatencyP95High
        expr: histogram_quantile(0.95, sum(rate(expenseiq_extraction_latency_seconds_bucket[5m])) by (le)) > 5
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "Extraction p95 latency above 5s"
          description: "Check the LLM provider, retry rate and self-healing attempts."
