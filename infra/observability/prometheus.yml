global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: expenseiq-ai
    static_configs:
      - targets: ["host.docker.internal:8000"]
  - job_name: expenseiq-backend
    static_configs:
      - targets: ["host.docker.internal:8081"]
